<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Staff - ISLA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo"><img src="WhatsApp Image 2026-08-08 at 8.20.53 PM - Copie.jpeg" alt="ISLA Étudiant" class="logo-image"></a>
            <nav class="main-nav"><a href="index.html">Accueil</a><a href="staff.html">Staff</a></nav>
        </div>
    </header>
    <main>
        <section class="section">
            <div class="container narrow-container">
                <span class="eyebrow">ESPACE STAFF</span>
                <h1 id="staffLoginTitle">Connexion Staff</h1>
                <div class="login-card section-spacing">
                    <p id="staffLoginDescription" class="login-intro"></p>
                    <form id="staffLoginForm">
                        <input type="hidden" id="staffRoleKey" name="staffRoleKey">
                        <div class="form-group">
                            <label for="staffUsername" id="staffUsernameLabel">Identifiant professionnel</label>
                            <input type="text" id="staffUsername" name="staffUsername" autocomplete="username" required>
                        </div>
                        <div class="form-group">
                            <label for="staffPassword">Mot de passe</label>
                            <input type="password" id="staffPassword" name="staffPassword" autocomplete="current-password" required>
                        </div>
                        <div id="staffLoginMessage" class="form-message" aria-live="polite"></div>
                        <button type="submit" class="btn btn-primary btn-full">Se connecter</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
