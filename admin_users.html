<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des utilisateurs - ISLA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header"><div class="container header-content"><a href="index.html" class="logo"><img src="WhatsApp Image 2026-08-08 at 8.20.53 PM - Copie.jpeg" alt="ISLA Étudiant" class="logo-image"></a><nav class="main-nav"><a href="admin.html">Administration</a><a href="admin_users.html" class="active">Utilisateurs</a><a href="admin_students.html">Étudiants</a><a href="admin_staff.html">Staff</a></nav></div></header>
    <main><section class="section"><div class="container">
        <span class="eyebrow">ADMINISTRATION</span><h1>Gestion des utilisateurs</h1>
        <div class="admin-layout">
            <form id="adminUserForm" class="login-card">
                <h2>Créer un compte</h2>
                <div class="form-group"><label for="adminFullName">Nom complet</label><input id="adminFullName" required></div>
                <div class="form-group"><label for="adminUsername">Identifiant professionnel / étudiant</label><input id="adminUsername" required></div>
                <div class="form-group"><label for="adminEmail">Email</label><input id="adminEmail" type="email" required></div>
                <div class="form-group"><label for="adminPassword">Mot de passe initial</label><input id="adminPassword" type="password" minlength="10" required></div>
                <div class="form-group"><label for="adminRole">Rôle</label><select id="adminRole" required><option value="Étudiant">Étudiant</option><option value="Administrateur">Administrateur</option><option value="Responsable d'établissement / DG">Responsable d'établissement / DG</option><option value="Secrétaire">Secrétaire</option><option value="Personnel d'animation">Personnel d'animation</option><option value="Comptable">Comptable</option><option value="Médecin / Service médical">Médecin / Service médical</option></select></div>
                <div id="adminUserMessage" class="form-message" aria-live="polite"></div><button class="btn btn-primary btn-full">Créer le compte</button>
            </form>
            <div><h2>Comptes enregistrés</h2><div id="adminUserList" class="admin-list"></div></div>
        </div>
    </div></section></main>
    <script src="script.js"></script>
</body>
</html>
