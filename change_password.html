<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Modifier le mot de passe - ISLA</title><link rel="stylesheet" href="style.css"></head>
<body><main><section class="section"><div class="container narrow-container"><span class="eyebrow">PREMIÈRE CONNEXION</span><h1>Créez votre mot de passe</h1><div class="login-card"><p class="login-intro">Pour protéger votre compte, choisissez un nouveau mot de passe d'au moins 10 caractères.</p><form id="changePasswordForm"><div class="form-group"><label for="newPassword">Nouveau mot de passe</label><input id="newPassword" type="password" minlength="10" autocomplete="new-password" required></div><div class="form-group"><label for="confirmPassword">Confirmer le mot de passe</label><input id="confirmPassword" type="password" minlength="10" autocomplete="new-password" required></div><div id="changePasswordMessage" class="form-message" aria-live="polite"></div><button class="btn btn-primary btn-full">Enregistrer et continuer</button></form></div></div></section></main><script src="script.js"></script></body></html>
