<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gestion des étudiants - ISLA</title><link rel="stylesheet" href="style.css"></head>
<body><header class="header"><div class="container header-content"><a href="index.html" class="logo"><img src="WhatsApp Image 2026-08-08 at 8.20.53 PM - Copie.jpeg" alt="ISLA Étudiant" class="logo-image"></a><nav class="main-nav"><a href="admin.html">Administration</a><a href="admin_users.html">Utilisateurs</a><a href="admin_students.html" class="active">Étudiants</a><a href="admin_staff.html">Staff</a></nav></div></header>
<main><section class="section"><div class="container"><span class="eyebrow">ADMINISTRATION</span><h1>Gestion des étudiants</h1><div class="management-toolbar"><input id="studentSearch" type="search" placeholder="Rechercher par nom, prénom ou matricule"><button id="showStudentForm" type="button" class="btn btn-primary">Ajouter un étudiant</button></div>
<form id="studentForm" class="management-form" hidden><div class="management-form__header"><h2 id="studentFormTitle">Ajouter un étudiant</h2><button id="closeStudentForm" type="button" class="btn btn-secondary">Fermer</button></div><input id="studentRecordId" type="hidden">
<fieldset><legend>Informations personnelles</legend><div class="form-grid"><label>Nom<input id="studentLastName" required></label><label>Prénom(s)<input id="studentFirstName" required></label><label>Date de naissance<div class="date-selects"><select id="studentBirthDay" required></select><select id="studentBirthMonth" required></select><select id="studentBirthYear" required></select></div></label><label>Sexe<select id="studentGender" required><option value="">Choisir</option><option>Féminin</option><option>Masculin</option><option>Autre / Non précisé</option></select></label><label>Nationalité<select id="studentNationality" class="dynamic-select" data-list="countries" required></select></label><label>Téléphone<div class="phone-field"><select id="studentPhonePrefix"><option value="+228">+228 (Togo)</option><option value="+225">+225 (Côte d’Ivoire)</option><option value="+33">+33 (France)</option><option value="other">Autre</option></select><input id="studentPhone" type="tel" inputmode="tel" placeholder="90 00 00 00" required></div></label><label class="form-grid__full">Email<input id="studentEmail" type="email"></label>
</div></fieldset>
<fieldset><legend>Adresse</legend><div class="form-grid"><label>Pays<select id="studentCountry" class="dynamic-select" data-list="countries" required></select></label><label>Ville<select id="studentCity" class="dynamic-select" data-list="cities" required></select></label><label>Quartier<select id="studentDistrict" class="dynamic-select" data-list="districts" required></select></label><label class="form-grid__full">Adresse complémentaire<input id="studentAddress" placeholder="Rue, maison, lot, repère…"></label></div></fieldset>
<fieldset><legend>Informations académiques</legend><div class="form-grid"><label>Matricule<div class="inline-control"><input id="studentMatricule" required><button id="generateMatricule" class="btn btn-secondary" type="button">Générer</button></div></label><label>Filière / Formation<select id="studentProgram" class="dynamic-select" data-list="programs" required></select></label><label>Niveau<select id="studentLevel" class="dynamic-select" data-list="levels" required></select></label><label>Classe / Groupe<select id="studentClass" class="dynamic-select" data-list="classes" required></select></label><label>Année académique<select id="studentAcademicYear" class="dynamic-select" data-list="academicYears" required></select></label><label>Statut étudiant<select id="studentStatus" required><option>Actif</option><option>Suspendu</option><option>Diplômé</option></select></label></div></fieldset>
<fieldset><legend>Informations du compte</legend><div class="form-grid"><label>Identifiant de connexion<input id="studentUsername" required></label><label>Mot de passe initial<input id="studentPassword" type="password" minlength="10" required></label><label>Statut du compte<select id="studentAccountActive"><option value="true">Actif</option><option value="false">Inactif</option></select></label></div></fieldset><div id="studentFormMessage" class="form-message" aria-live="polite"></div><button class="btn btn-primary">Enregistrer l'étudiant</button></form><div id="studentList" class="management-list"></div></div></section></main><script src="script.js"></script></body></html>
